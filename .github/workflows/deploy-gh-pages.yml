name: Deploy to GitHub Pages

on:
  push:
    branches: [ develop ]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Create production env file from secret
        env:
          VITE_API_BASE: ${{ secrets.VITE_API_BASE }}
        run: |
          if [ -z "${VITE_API_BASE}" ]; then
            echo "Warning: VITE_API_BASE secret is not set. The build will use any committed .env.github file or default values.";
          else
            echo "VITE_API_BASE=${VITE_API_BASE}" > .env.github
            echo ".env.github created from secret"
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build for GitHub Pages
        run: npm run build:github

      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4.4.0
        with:
          branch: gh-pages
          folder: dist
          clean: true
          token: ${{ secrets.GITHUB_TOKEN }}
